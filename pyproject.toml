[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-llm"
version = "0.1.0"
description = "Aegis-LLM — safe-by-design, multi-agent LLM red-teaming platform backend"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "Apache-2.0" }
dependencies = [
    # API
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-multipart>=0.0.9",
    # Data
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "psycopg[binary]>=3.1",
    "redis>=5.0",
    "arq>=0.26",
    # Interaction layer
    "httpx>=0.27",
    "playwright>=1.44",
    "websockets>=12.0",
    # Agents / payloads / detection
    "PyYAML>=6.0",
    "numpy>=1.26",
    # Auth
    "python-jose[cryptography]>=3.3",
    # Reporting
    "Jinja2>=3.1",
    # Observability
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
enterprise = [
    "authlib>=1.3",
    "neo4j>=5.20",
    "opentelemetry-api>=1.24",
    "opentelemetry-sdk>=1.24",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[project.scripts]
aegis = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
